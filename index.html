<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Made For TuyetVy 🎁</title>
    <meta name="description" content="Một món quà đầy yêu thương đang chờ bạn khám phá!">

    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo.png">

    <meta property="og:title" content="Made For TuyetVy 🎁">
    <meta property="og:description" content="Một món quà đầy yêu thương đang chờ bạn khám phá!">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="css/google-fonts-pacifico.css" rel="stylesheet">
    <link href="css/google-fonts-dancing-script.css" rel="stylesheet">

    <link rel="stylesheet" href="css/index.css">

    <!-- Loading + Book Hint CSS -->
    <style>
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            animation: fadeIn 0.3s ease-in-out;
        }

        .loading-content {
            text-align: center;
            color: white;
            padding: 20px;
        }

        .loading-spinner {
            width: 30px;
            height: 30px;
            border: 4px solid rgba(51, 10, 58, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading-content h2 {
            font-size: 24px;
            margin-bottom: 10px;
            font-family: 'Pacifico', Arial, sans-serif;
        }

        .loading-content p {
            font-size: 16px;
            opacity: 0.8;
            font-family: 'Pacifico', Arial, sans-serif;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Book hint */
        ..book-hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 26px;
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    background: none;
    padding: 0;
    border-radius: 0;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    text-shadow: 0 0 10px #fe6bb3, 0 0 20px #fe6bb3, 0 0 30px #fe6bb3;
}

        .book-hint.show {
            opacity: 1;
            animation: hintPulse 2s ease-in-out infinite;
        }

        @keyframes hintPulse {
            0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.7; }
            50% { transform: translateX(-50%) translateY(-5px); opacity: 1; }
        }

        @media (max-width: 600px) {
            .book-hint {
                font-size: 14px;
                bottom: 20px;
                padding: 8px 16px;
            }
        }
    </style>
</head>

<body>
    <!-- LOADING SCENE -->
    <div id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <h2>Đang chuẩn bị điều đặc biệt...</h2>
            <p>Dành tặng cho em, người đẹp của anh.</p>
        </div>
    </div>

    <!-- Canvas matrix rain -->
    <canvas id="matrix-rain" style="display: none;"></canvas>

    <!-- Canvas dots -->
    <canvas style="position:absolute;width:100%;height:100%;z-index:9999;display:none;" class="canvas"></canvas>

    <div class="overlay">
        <div class="stars-container" id="starsContainer"></div>

        <img id="gift-image" src="images/happy3.gif"
            style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10000; max-width: 80%; max-height: 80%;" />

        <div class="content-display" id="contentDisplay">
            <p id="contentText"></p>
        </div>

        <div class="firework-container" id="fireworkContainer"></div>

        <div class="book-container">
            <div class="book" id="book"></div>
        </div>

        <button class="music-control" id="musicControl" title="Play/Pause Music">▶</button>

        <audio id="birthdayAudio" loop>
            <source src="media/happybirtday_uia.mp3" type="audio/mpeg">
        </audio>

        <div id="orientation-lock">
            <div class="phone-icon">
                <img src="images/screen.png" alt="">
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/settings.js"></script>
    <script src="js/ui.js"></script>
</body>

</html>
